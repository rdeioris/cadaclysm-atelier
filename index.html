<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier</title>
<!-- unlisted: no link to it from the site, and kept out of search engines -->
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="atelier.css">
</head>
<body>
<header>
    <h1>cadaclysm <span>atelier</span></h1>
    <nav class="group" id="menu">
        <button id="menu-new" title="A new garment">New</button>
        <button id="menu-sample" title="Open the sample garment: a T-shirt on the f-M form">Sample: T-shirt</button>
        <button id="menu-open" title="Open a garment (.json), Ctrl+O">Open</button>
        <button id="menu-save" title="Save the garment (.json), Ctrl+S">Save</button>
        <button id="menu-import-dxf" title="Add the pieces of an AAMA/ASTM DXF">Import DXF</button>
        <button id="menu-export-dxf" title="Write the pieces as AAMA DXF">Export DXF</button>
        <button id="menu-avatar" title="Load a dress form (STEP or STL)">Avatar</button>
    </nav>
    <input type="file" id="file-in" hidden>
</header>
<main id="split">
    <div class="strip" id="tools3d">
        <span class="tag">3D</span>
        <button data-command="simulate" id="sim-toggle" title="Run the cloth: sew, then drape on the avatar (Pause stops it)">Simulate</button>
        <button data-command="reset" id="sim-reset" disabled title="Drop the cloth: back to the flat pieces">Reset</button>
        <span class="sep"></span>
        <button data-tool3d="pin" title="Pin: click the cloth to pin or unpin a point">Pin</button>
        <button data-tool3d="drag" title="Drag: pull the cloth with the mouse while it runs">Drag</button>
        <button data-tool3d="place" title="Place on avatar: with a piece selected, click the avatar to put the piece there">Place</button><span class="place-opts"><label title="Wrap: a click on an arm wraps the piece round it, as the arm slots do"><input type="checkbox" id="place-wrap" checked> Wrap</label></span>
        <button id="tape-toggle" title="Tape: measure on the avatar or the garment">Tape</button><span class="tape-opts"><button data-tape-mode="path" title="Path: click points on the surface; double click or Enter ends, Escape drops it">Path</button><button data-tape-mode="girth" title="Girth: one click, the horizontal loop through it">Girth</button><label title="Hull: a real tape's girth over the hollows (the loop's convex hull); remembered for the avatar and the garment"><input type="checkbox" id="tape-hull" checked> Hull</label><button id="tape-clear" title="Clear every measure">Clear</button></span>
        <select id="map-select" title="Fit map: colour the cloth by its strain or stress"></select>
        <span class="sep"></span>
        <button data-command="arrange" title="Place the pieces around the avatar">Arrange</button>
        <span id="sim-engine" title="which engine steps the cloth"></span>
        <button data-command="gia" id="sim-gia" disabled title="GIA: the global intersection analysis (self-collision untangling)">GIA</button>
        <span id="health" title="the solver's status: frame, phase, welded seam pairs, mesh size, fastest particle"></span>
    </div>
    <div id="divider" title="Drag to resize; F2 / F3 maximise 2D / 3D"></div>
    <div class="strip" id="tools2d">
        <span class="tag">2D</span>
        <button data-tool="edit" title="Edit points and edges (Z)">Edit</button>
        <button data-tool="transform" title="Move pieces (A)">Move</button>
        <button data-tool="rectangle" title="Rectangle (S)">Rect</button>
        <button data-tool="polygon" title="Polygon: click points, drag for curves, click the first to close (H)">Polygon</button>
        <button data-tool="ellipse" title="Ellipse: drag corner to corner, Shift for a circle; a click asks for its size (E)">Ellipse</button>
        <button data-tool="internal" title="Internal line on the selected piece (G): click corners, drag for curve points; Enter or double click ends">Internal</button><button data-tool="internal-rectangle" title="An internal rectangle on a piece">Int □</button><button data-tool="internal-ellipse" title="An internal ellipse on a piece">Int ○</button><button data-tool="internal-polygon" title="An internal polygon on a piece">Int ⬠</button><button data-tool="to-hole" title="Convert to hole: click an internal closed shape">To hole</button>
        <button data-tool="notch" title="Notch: click an edge">Notch</button>
        <button data-tool="dart" title="Dart: two edge points, then the apex">Dart</button>
        <span class="sep"></span><button data-tool="cut" title="Cut: click an internal line, or draw a cutter across the selected piece (Enter ends)">Cut</button><button data-tool="cut-sew" title="Cut &amp; sew: cut, and sew the two new edges">Cut &amp; sew</button><button data-tool="trace" title="Trace: click an internal closed shape to copy it out as a piece">Trace</button><button data-tool="fillet" title="Fillet: click a corner, then drag or type the radius">Fillet</button>
        <span class="sep"></span><button data-tool="hole-rectangle" title="A rectangular hole in a piece: drag, or click for a size">Hole □</button><button data-tool="hole-ellipse" title="An elliptical hole in a piece">Hole ○</button><button data-tool="hole-polygon" title="A polygonal hole in a piece">Hole ⬠</button>
        <button data-tool="mirror" title="Mirror the selected piece across a two-click axis">Mirror</button><button data-tool="sym" title="Symmetric pair: mirror the selected piece across a two-click axis, linked; an edit of either rebuilds the other (Unlink in the panel)">Sym</button><button data-tool="unfold" title="Unfold: click a straight side of a piece to make it whole across that side (Fold back in the panel)">Unfold</button>
        <button data-tool="allowance" title="Seam allowance: click an edge, type mm, Enter">Allowance</button>
        <button data-tool="grain" title="Grain line of the selected piece: drag">Grain</button>
        <button data-tool="ruler" title="Ruler (R): two clicks measure a distance, a click on an edge its side's length; Escape clears">Ruler</button>
        <button data-tool="print" title="Print: click a print to move it; drag its corners to scale it, the handle above it to turn it (Shift: 15° steps); Delete removes it">Print</button><button id="print-image" title="Pick an image (PNG, JPEG), then click on a piece to place it as a print">Print image…</button>
        <span class="sep"></span>
        <button data-tool="segment" title="Segment sewing: pick two sides (N)">Sew sides</button>
        <button data-tool="free" title="Free sewing: two clicks on each piece (M)">Sew free</button>
        <button data-tool="sewmn" title="M:N sewing: side A's ranges (a click takes a side, Shift + two clicks a free range), Enter, side B's, Enter sews (B)">Sew M:N</button>
        <span class="sep"></span>
        <button data-toggle="grid" title="Snap to the 10 mm grid">Grid</button>
        <button data-command="fit" title="Fit the pieces (F)">Fit</button>
        <span class="sep"></span>
        <select id="size-select" title="Size: every graded piece in this size (one undo step); the base is drafted, the others graded from it"></select><button id="sizes-open" title="Sizes: add, rename, remove and reorder the sizes; choose the base">Sizes…</button><button id="show-sizes" title="Show sizes: every size's outline of the selected pieces (the graded nest)">Show sizes</button>
    </div>
    <div class="well" id="well"><canvas id="view" tabindex="0"></canvas><div id="map-legend" hidden><span class="map-title"></span><div class="map-bar"></div><div class="map-range"><input class="map-lo" id="map-lo" inputmode="decimal" title="The map's minimum (blue)"> <span class="map-unit"></span><span class="map-dash">to</span><input class="map-hi" id="map-hi" inputmode="decimal" title="The map's maximum (red)"> <span class="map-unit"></span></div><div id="map-value"></div></div><div id="typed" tabindex="-1" hidden><input id="typed-length" inputmode="decimal" title="Length, mm"> mm <input id="typed-angle" inputmode="decimal" title="Angle, degrees (blank: toward the pointer)"> °</div><div id="point-menu" role="menu" hidden><button type="button" id="point-curve" role="menuitem">Make curve point</button><button type="button" id="point-corner" role="menuitem">Make corner</button></div></div>
    <aside id="dock">
        <div id="browser">
            <h2>Fabrics</h2><ul id="browser-fabrics"></ul>
            <div class="lib"><select id="lib-select" title="A fabric from the library"></select><button id="lib-add" title="Add it to the document">Add</button></div>
            <h2>Patterns</h2><ul id="browser-patterns"></ul>
            <h2>Seams</h2><ul id="browser-seams"></ul>
            <h2>Avatar</h2><ul id="browser-avatar"></ul>
        </div>
        <div id="props"><p class="dim">Nothing selected</p></div>
    </aside>
</main>
<footer>
    <div id="status"><span id="status-text">loading the kernel…</span><span id="issues"></span></div>
    <span id="fps" title="simulated frames per second, and the time one step takes">—</span>
    <span id="lic"></span>
</footer>
<dialog id="size-dialog"><form method="dialog">
    <p id="size-title"></p>
    <label><span id="size-wl">Width</span> <input id="size-w" inputmode="decimal" value="100"> mm</label>
    <label><span id="size-hl">Height</span> <input id="size-h" inputmode="decimal" value="100"> mm</label>
    <menu><button id="size-cancel" type="button">Cancel</button><button id="size-ok" value="ok">OK</button></menu>
</form></dialog>
<dialog id="sizes-dialog"><form method="dialog">
    <p>Sizes <span class="dim">(in order; the base is drafted, the others graded from it)</span></p>
    <ol id="sizes-list"></ol>
    <p><label>New size <input id="sizes-name" placeholder="L"></label> <button type="button" id="sizes-add">Add</button></p>
    <menu><button id="sizes-close" value="close">Close</button></menu>
</form></dialog>
<script type="module" src="atelier.js"></script>
</body>
</html>
